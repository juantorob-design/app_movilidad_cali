[web]
# Única cuenta que puede abrir esta instancia.
owner_email = "tu.correo@gmail.com"

[auth]
# Debe coincidir exactamente con la URL callback permitida en Google Cloud:
# https://TU-DOMINIO/oauth2callback
redirect_uri = "https://TU-DOMINIO/oauth2callback"
# Genera un secreto aleatorio largo para firmar las cookies de sesión.
cookie_secret = "REEMPLAZAR_POR_UN_SECRETO_ALEATORIO_LARGO"

[auth.google]
client_id = "CLIENT_ID_DE_APLICACION_WEB"
client_secret = "CLIENT_SECRET_DE_APLICACION_WEB"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[global]
developmentMode = false
suppressDeprecationWarnings = true

[theme]
primaryColor = "#38bdf8"
backgroundColor = "#0d1322"
secondaryBackgroundColor = "#172136"
textColor = "#f8fafc"
font = "sans serif"
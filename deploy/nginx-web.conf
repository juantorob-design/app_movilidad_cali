map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 220m;

    location = /manifest.webmanifest {
        alias /usr/share/nginx/html/pwa/manifest.webmanifest;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        alias /usr/share/nginx/html/pwa/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location = /pwa-register.js {
        alias /usr/share/nginx/html/pwa/register.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    location = /pwa/icon-192.png {
        alias /usr/share/nginx/html/pwa/icon-192.png;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /pwa/icon-512.png {
        alias /usr/share/nginx/html/pwa/icon-512.png;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /icon-192.png {
        alias /usr/share/nginx/html/pwa/icon-192.png;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /icon-512.png {
        alias /usr/share/nginx/html/pwa/icon-512.png;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /offline.html {
        alias /usr/share/nginx/html/pwa/offline.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://mobile-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://web:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>' '<meta name="theme-color" content="#0d1322"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/pwa/icon-192.png"></head>';
        sub_filter '</body>' '<script src="/pwa-register.js" defer></script></body>';
    }
}

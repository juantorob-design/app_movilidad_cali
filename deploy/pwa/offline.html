<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d1322">
    <title>Sin conexión</title>
    <style>
      body { background:#0d1322; color:#f8fafc; font:16px system-ui,sans-serif; margin:0; min-height:100vh; display:grid; place-items:center; }
      main { max-width:32rem; padding:2rem; text-align:center; }
      button { background:#38bdf8; border:0; border-radius:.5rem; color:#0d1322; font:inherit; font-weight:700; padding:.75rem 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>Para proteger los expedientes, esta aplicación solo muestra y procesa datos cuando el servidor está disponible.</p>
      <button onclick="location.reload()">Volver a intentar</button>
    </main>
  </body>
</html>
